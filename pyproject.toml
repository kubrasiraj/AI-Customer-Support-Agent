[project]
name = "ai-customer-support-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Kubra Siraj",email = "kubrasiraj267@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "bcrypt (<5)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "google-genai (>=2.29.0,<3.0.0)",
    "langchain (>=1.4.3,<2.0.0)",
    "langchain-core (>=1.6.7,<2.0.0)",
    "langchain-google-genai (>=4.4.0,<5.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "openai (>=3.31.0,<4.0.0)",
    "pypdf (>=6.20.1,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
